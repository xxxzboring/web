<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵飞 · 我的音乐收藏</title>
<style>
  :root{
    --bg:#0b0d14;
    --card:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.09);
    --txt:#eef1f7;
    --dim:#8d94a8;
    --acc:#31e0a2;
    --acc2:#5b8cff;
    --bar:rgba(12,15,24,.88);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;
    padding-bottom:112px;overflow-x:hidden;
  }
  .glow{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
      radial-gradient(900px 500px at 12% -8%, rgba(49,224,162,.15), transparent 60%),
      radial-gradient(800px 480px at 88% 0%, rgba(91,140,255,.15), transparent 62%),
      linear-gradient(180deg,#0b0d14 0%,#0a0c12 60%,#08090e 100%);}
  .glow::after{content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:26px 26px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 72%);
    mask-image:linear-gradient(180deg,#000,transparent 72%);}

  .wrap{max-width:1180px;margin:0 auto;padding:32px 22px 10px}

  /* ---------- 顶部 ---------- */
  header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:20px}
  .avatar{
    width:72px;height:72px;border-radius:22px;flex:none;
    background:linear-gradient(145deg,var(--acc),var(--acc2));
    display:grid;place-items:center;font-size:28px;font-weight:700;color:#08120e;
    box-shadow:0 12px 34px rgba(49,224,162,.2);
  }
  .htxt h1{font-size:27px;letter-spacing:.5px;line-height:1.25}
  .htxt h1 small{font-weight:400;font-size:13.5px;color:var(--dim);margin-left:10px;letter-spacing:0}
  .meta{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--dim);flex-wrap:wrap;align-items:center}
  .meta b{color:var(--txt);font-weight:600}
  .meta i{font-style:normal;color:rgba(255,255,255,.16)}

  /* ---------- 精选大图 ---------- */
  .hero{
    position:relative;display:flex;gap:26px;align-items:center;
    padding:22px;border-radius:24px;margin-bottom:24px;overflow:hidden;
    border:1px solid var(--line);
    background:linear-gradient(120deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  }
  .hero-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;
    filter:blur(46px) saturate(1.25);opacity:.34;transform:scale(1.15);z-index:0}
  .hero-mask{position:absolute;inset:0;z-index:0;
    background:linear-gradient(100deg,rgba(10,12,18,.72) 30%,rgba(10,12,18,.35) 100%)}
  .hero>*{position:relative;z-index:1}
  .hero-cover{
    width:180px;height:180px;border-radius:16px;overflow:hidden;flex:none;
    box-shadow:0 26px 60px rgba(0,0,0,.55);background:#151b28;
  }
  .hero-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .hero-txt{min-width:0;flex:1}
  .tag{display:inline-block;font-size:11.5px;letter-spacing:1.4px;color:var(--acc);
    border:1px solid rgba(49,224,162,.4);background:rgba(49,224,162,.1);
    padding:4px 10px;border-radius:99px;margin-bottom:14px}
  .hero-txt h2{font-size:34px;line-height:1.22;letter-spacing:.3px;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .hero-sub{margin-top:12px;font-size:14.5px;color:#b9c0d0;line-height:1.7}
  .hero-sub span{color:var(--dim)}
  .hero-btns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:12px;
    border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);
    font-size:13.5px;cursor:pointer;text-decoration:none;transition:.2s}
  .btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
  .btn.main{background:var(--acc);border-color:var(--acc);color:#07100c;font-weight:600}
  .btn.main:hover{background:#42f0b4}

  /* ---------- 工具条 ---------- */
  .tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 20px}
  .search{position:relative;flex:1;min-width:200px;max-width:360px}
  .search input{width:100%;padding:11px 14px 11px 40px;border-radius:13px;border:1px solid var(--line);
    background:var(--card);color:var(--txt);font-size:14px;outline:none;transition:.22s}
  .search input:focus{border-color:rgba(49,224,162,.5);background:rgba(49,224,162,.06)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
  .chip{padding:10px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
    color:var(--dim);font-size:13px;cursor:pointer;transition:.2s;user-select:none;white-space:nowrap}
  .chip:hover{color:var(--txt);border-color:rgba(255,255,255,.2)}
  .chip.on{background:rgba(49,224,162,.14);border-color:rgba(49,224,162,.45);color:var(--acc)}
  .count{margin-left:auto;font-size:13px;color:var(--dim)}

  /* ---------- 收藏墙 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:22px 18px}
  .card{cursor:pointer;transition:transform .28s cubic-bezier(.2,.7,.3,1)}
  .card:hover{transform:translateY(-5px)}
  .cover{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;
    background:linear-gradient(145deg,#1b2233,#131824);box-shadow:0 10px 26px rgba(0,0,0,.38)}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
  .card:hover .cover img{transform:scale(1.06)}
  .cover .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.14);font-size:26px}
  .playbtn{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;
    border:none;display:grid;place-items:center;cursor:pointer;color:#fff;
    background:rgba(10,12,18,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    opacity:0;transform:translateY(6px) scale(.9);transition:.25s}
  .card:hover .playbtn{opacity:1;transform:none}
  .playbtn:hover{background:var(--acc);color:#07100c}
  .card.playing .cover{outline:2px solid var(--acc);outline-offset:-2px}
  .card.playing .cover::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.34)}
  .card.playing .playbtn{opacity:1;transform:none;background:var(--acc);color:#07100c}
  .t1{margin-top:11px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t2{margin-top:4px;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card.playing .t1{color:var(--acc)}
  body:not(.list) .card .dur{display:none}
  .hero-side{width:272px;flex:none;border-left:1px solid rgba(255,255,255,.1);padding-left:24px}
  .hero-side h3{font-size:11.5px;letter-spacing:1.6px;color:var(--dim);font-weight:600;margin-bottom:12px}
  .hrow{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;
    cursor:pointer;transition:.18s;margin:0 -8px}
  .hrow:hover{background:rgba(255,255,255,.07)}
  .hrow .hn{font-size:11.5px;color:var(--dim);width:12px;flex:none;
    font-variant-numeric:tabular-nums}
  .hrow .ht{min-width:0;flex:1}
  .hrow .ht b{display:block;font-size:13px;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow .ht span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:980px){.hero-side{display:none}}
  .empty{padding:66px 0;text-align:center;color:var(--dim);font-size:14px;display:none}

  /* ---------- 播放条 ---------- */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--bar);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
    border-top:1px solid var(--line)}
  .bar-in{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px}
  .bcover{width:50px;height:50px;border-radius:12px;overflow:hidden;flex:none;background:#1a2030}
  .bcover img{width:100%;height:100%;object-fit:cover;display:block}
  .binfo{min-width:0;width:190px;flex:none}
  .binfo .bt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .binfo .bs{font-size:12px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctrl{display:flex;align-items:center;gap:6px}
  .icb{width:38px;height:38px;border-radius:50%;border:none;background:transparent;color:var(--txt);
    display:grid;place-items:center;cursor:pointer;transition:.18s;flex:none}
  .icb:hover:not(:disabled){background:rgba(255,255,255,.08)}
  .icb:disabled{opacity:.28;cursor:not-allowed}
  .icb.main{width:44px;height:44px;background:var(--acc);color:#07100c}
  .icb.main:hover:not(:disabled){background:#40f0b2;transform:scale(1.04)}
  .prog{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
  .time{font-size:11.5px;color:var(--dim);width:38px;text-align:center;
    font-variant-numeric:tabular-nums;flex:none}
  .track{height:5px;flex:1;border-radius:99px;background:rgba(255,255,255,.12);position:relative;cursor:pointer}
  .track:hover .knob{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));
    transition:width .12s linear}
  .knob{position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%) scale(.7);opacity:0;transition:.18s;
    box-shadow:0 0 0 4px rgba(49,224,162,.18)}
  .eq{display:flex;align-items:flex-end;gap:2.5px;height:18px;width:22px;flex:none;opacity:.9}
  .eq span{width:3px;background:var(--acc);border-radius:2px;height:20%}
  .eq.on span{animation:bounce .9s ease-in-out infinite}
  .eq.on span:nth-child(2){animation-delay:.15s;background:var(--acc2)}
  .eq.on span:nth-child(3){animation-delay:.3s}
  .eq.on span:nth-child(4){animation-delay:.45s;background:var(--acc2)}
  @keyframes bounce{0%,100%{height:22%}50%{height:100%}}

  /* ---------- 列表视图 ---------- */
  body.list .grid{display:flex;flex-direction:column;gap:2px}
  body.list .card{display:grid;grid-template-columns:44px 1fr 150px 76px;align-items:center;gap:14px;
    padding:8px 12px;border-radius:12px}
  body.list .card:hover{background:var(--card);transform:none}
  body.list .cover{border-radius:8px;width:44px;box-shadow:none}
  body.list .t1{margin:0}
  body.list .t2{margin:0;text-align:right;grid-column:3}
  body.list .card .dur{grid-column:4;text-align:right;font-size:12.5px;color:var(--dim);
    font-variant-numeric:tabular-nums}
  body.list .playbtn{display:none}

  .hint{font-size:12px;color:#5f6678;text-align:center;padding:30px 0 8px;line-height:1.9}

  @media(max-width:760px){
    .wrap{padding:22px 15px 0}
    .hero{flex-direction:column;align-items:flex-start;padding:20px;gap:18px}
    .hero-cover{width:100%;height:auto;aspect-ratio:1;max-width:220px}
    .hero-txt h2{font-size:24px}
    .avatar{width:58px;height:58px;border-radius:18px;font-size:22px}
    .htxt h1{font-size:20px}
    .htxt h1 small{display:none}
    .grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:16px 13px}
    .binfo{width:auto;flex:1}
    .prog{display:none}
    .bar-in{padding:10px 14px;gap:10px}
    body.list .card{grid-template-columns:40px 1fr 44px}
    body.list .t2{display:none}
    body.list .card .dur{grid-column:3}
  }
</style>
</head>
<body>
<div class="glow"></div>

<div class="wrap">
  <header>
    <div class="avatar">赵</div>
    <div class="htxt">
      <h1>赵飞的音乐收藏 <small>我喜欢的歌，都在这里</small></h1>
      <div class="meta">
        <span>收藏 <b id="stat-num">0</b> 首</span>
        <i>|</i>
        <span>总时长 <b id="stat-dur">0</b></span>
        <i>|</i>
        <span>整理自 <b>QQ 音乐 · 我喜欢</b></span>

      <h2 id="hero-name">—</h2>

        <span>歌手 </span><b id="hero-singer">—</b>
      </div>
      <div class="hero-sub">
        <span>专辑 </span><b id="hero-album">—</b>
      </div>
      <div class="hero-btns">
        <button class="btn main" id="hero-play">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          播放这首
        </button>
        <a class="btn" id="hero-open" href="https://y.qq.com" target="_blank" rel="noopener">在 QQ 音乐打开</a>
      </div>
    </div>
    <div class="hero-side">
      <h3>最近收藏</h3>
      <div id="hero-side"></div>

  </section>

  <div class="tools">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜索歌名 / 歌手 / 专辑" autocomplete="off">
    </div>
    <div class="chip on" id="sort-default">默认顺序</div>
    <div class="chip" id="sort-name">按歌名</div>

    <div class="chip" id="view">列表视图</div>
    <div class="count" id="count"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">没有找到匹配的歌曲</div>

  <div class="hint">
    课程作业展示页 · 封面与歌曲信息来自 QQ 音乐公开数据，点击「在 QQ 音乐收听」跳转正版播放<br>
    赵飞 · 学号 202511160406 · Web 前端随堂作业 work1
  </div>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="bcover"><img id="bcover" alt=""></div>
    <div class="binfo">
      <div class="bt" id="btitle">未选择歌曲</div>
      <div class="bs" id="bsinger">从下面的收藏里点一首开始</div>
    </div>
    <div class="ctrl">
      <button class="icb" id="prev" title="上一首">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
      </button>
      <button class="icb main" id="play" title="播放 / 暂停（空格）">
        <svg id="ic-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="ic-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
      </button>
      <button class="icb" id="next" title="下一首">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l10.5 7L4 19z"/></svg>
      </button>
    </div>
    <div class="prog">
      <span class="time" id="cur">0:00</span>
      <div class="track" id="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
      <span class="time" id="dur">0:00</span>
    </div>
    <div class="eq" id="eq"><span></span><span></span><span></span><span></span></div>
    <a class="chip" id="openqq" href="https://y.qq.com" target="_blank" rel="noopener" style="text-decoration:none">在 QQ 音乐收听</a>
  </div>
</div>

<script>
/* ===== 歌单数据（来自 QQ 音乐「我喜欢」，封面取 QQ 音乐专辑图 CDN） ===== */
const SONGS = [
    {

    {

    },
    {
      "name": "Float",

      "album": "Float",

      "cover": "https://y.qq.com/music/photo_new/T002R300x300M000003UCUe61GgdQU.jpg",

    },
    {
      "name": "free flow (Explicit)",
      "singer": "Kamal.",
      "album": "so here you are, drowning (Explicit)",
      "interval": 203,
      "cover": "https://y.qq.com/music/photo_new/T002R300x300M000002QCZnr2NT2ws.jpg",
      "link": "https://y.qq.com/n/ryqq/songDetail/0002HRYc3nYyKT"
    }
  ];

const $ = s => document.querySelector(s);
const grid = $('#grid'), empty = $('#empty');
let view = [...SONGS];
let curIdx = -1, playing = false, timer = null, pos = 0;

const fmt = s => {
  s = Math.max(0, Math.round(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){
  grid.innerHTML = view.map((s, i) => `
    <div class="card" data-i="${i}" title="${esc(s.name)} — ${esc(s.singer)}">
      <div class="cover">
        <div class="ph">♪</div>
        ${s.cover ? `<img src="${esc(s.cover)}" alt="" onerror="this.style.display='none'">` : ''}
        <button class="playbtn" title="播放">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
      <div class="t1">${esc(s.name)}</div>
      <div class="t2">${esc(s.singer)}</div>
      <div class="dur">${s.interval ? fmt(s.interval) : ''}</div>
    </div>`).join('');
  empty.style.display = view.length ? 'none' : 'block';
  $('#count').textContent = `显示 ${view.length} / ${SONGS.length} 首`;
  markPlaying();
}

function markPlaying(){
  grid.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('playing', +c.dataset.i === curIdx && curIdx >= 0));
}

function load(i, autoplay){
  if(i < 0 || i >= view.length) return;
  curIdx = i;
  const s = view[i];
  $('#btitle').textContent = s.name;
  $('#bsinger').textContent = s.singer + (s.album ? ' · ' + s.album : '');
  const img = $('#bcover');
  if(s.cover){ img.src = s.cover; img.style.visibility = 'visible'; }
  else { img.removeAttribute('src'); img.style.visibility = 'hidden'; }
  $('#openqq').href = s.link || 'https://y.qq.com';
  $('#dur').textContent = fmt(s.interval || 0);
  pos = 0; paint(); markPlaying();
  if(autoplay) play(); else pause();
}

function paint(){
  const s = view[curIdx] || {};
  const total = s.interval || 0;
  const pct = total ? Math.min(100, pos / total * 100) : 0;
  $('#fill').style.width = pct + '%';
  $('#knob').style.left = pct + '%';
  $('#cur').textContent = fmt(pos);
}

function play(){
  if(curIdx < 0 && view.length) load(0, false);
  if(curIdx < 0) return;
  playing = true;
  $('#ic-play').style.display = 'none';
  $('#ic-pause').style.display = '';
  $('#eq').classList.add('on');
  clearInterval(timer);
  timer = setInterval(() => {
    const total = (view[curIdx] || {}).interval || 0;
    if(!total) return;
    pos += .25;
    if(pos >= total){ pos = 0; load((curIdx + 1) % view.length, true); return; }
    paint();
  }, 250);
}

function pause(){
  playing = false;
  clearInterval(timer);
  $('#ic-play').style.display = '';
  $('#ic-pause').style.display = 'none';
  $('#eq').classList.remove('on');
}

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if(!card) return;
  const i = +card.dataset.i;
  if(i === curIdx && playing) pause(); else load(i, true);
});

$('#play').onclick = () => playing ? pause() : play();
$('#next').onclick = () => { if(view.length) load((curIdx + 1 + view.length) % view.length, true); };
$('#prev').onclick = () => { if(view.length) load((curIdx - 1 + view.length) % view.length, true); };

$('#track').addEventListener('click', e => {
  if(curIdx < 0) return;
  const total = (view[curIdx] || {}).interval || 0;
  if(!total) return;
  const r = e.currentTarget.getBoundingClientRect();
  pos = Math.min(total, Math.max(0, (e.clientX - r.left) / r.width * total));
  paint();
});

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.code === 'Space'){ e.preventDefault(); playing ? pause() : play(); }
  if(e.code === 'ArrowRight') $('#next').click();
  if(e.code === 'ArrowLeft') $('#prev').click();
});

// 搜索
$('#q').addEventListener('input', e => {
  const k = e.target.value.trim().toLowerCase();
  view = !k ? [...SONGS] : SONGS.filter(s =>
    (s.name + ' ' + s.singer + ' ' + (s.album || '')).toLowerCase().includes(k));
  curIdx = -1; render(); pause(); pos = 0; paint();
});

// 排序
const chips = ['#sort-default', '#sort-name', '#sort-singer'];
function setSort(which){
  chips.forEach(c => $(c).classList.toggle('on', c === which));
  view = [...SONGS];
  if(which === '#sort-name') view.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  if(which === '#sort-singer') view.sort((a, b) => a.singer.localeCompare(b.singer, 'zh'));
  curIdx = -1; render(); pause(); pos = 0; paint();
}
chips.forEach(c => $(c).onclick = () => setSort(c));

$('#view').onclick = () => {
  document.body.classList.toggle('list');
  $('#view').textContent = document.body.classList.contains('list') ? '网格视图' : '列表视图';
};

// 封面图加载失败时退回占位
$('#hero-img').onerror = () => { $('#hero-img').style.opacity = '0'; };

// 精选大图
const hero = SONGS[0] || {name:'—', singer:'—', album:'—'};
$('#hero-name').textContent = hero.name;
$('#hero-singer').textContent = hero.singer;
$('#hero-album').textContent = hero.album || '—';
$('#hero-open').href = hero.link || 'https://y.qq.com';
if(hero.cover){
  $('#hero-img').src = hero.cover;
  $('#hero-bg').style.backgroundImage = `url("${hero.cover}")`;
}
$('#hero-play').onclick = () => { view = [...SONGS]; render(); load(0, true); };

// 右侧「最近收藏」三首
const side = $('#hero-side');
side.innerHTML = SONGS.slice(1, 4).map((s, k) => `
  <div class="hrow" data-i="${k + 1}">
    <span class="hn">${k + 2}</span>
    <div class="ht"><b>${esc(s.name)}</b><span>${esc(s.singer)}</span></div>
  </div>`).join('');
side.addEventListener('click', e => {
  const row = e.target.closest('.hrow');
  if(!row) return;
  view = [...SONGS]; render(); load(+row.dataset.i, true);
});

// 统计
$('#stat-num').textContent = SONGS.length;
const totalSec = SONGS.reduce((a, s) => a + (s.interval || 0), 0);
$('#stat-dur').textContent = totalSec >= 3600
  ? Math.floor(totalSec / 3600) + ' 小时 ' + Math.round(totalSec % 3600 / 60) + ' 分钟'
  : Math.round(totalSec / 60) + ' 分钟';

render();
</script>
</body>
</html>
